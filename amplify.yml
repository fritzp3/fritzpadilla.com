# AWS Amplify Hosting build settings (see docs/aws-setup.md). Amplify builds
# every push to main and publishes the static export in out/.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install # reads .nvmrc (Node 22)
        - nvm use
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
